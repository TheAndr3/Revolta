<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Revolta</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <!-- Os textos visíveis vêm de content/telas.json (atributos data-texto*). -->

    <!-- Abertura animada (floresta, Protagonista, Almas) atrás da capa e do menu. -->
    <canvas id="abertura-fundo" class="abertura-fundo" aria-hidden="true" hidden></canvas>

    <section id="tela-capa" class="tela tela-abertura" aria-labelledby="titulo-capa">
      <div class="abertura-topo">
        <h1 id="titulo-capa" class="sr-only" data-texto="capa.titulo">Revolta</h1>
        <canvas class="logo-revolta" aria-hidden="true"></canvas>
        <p class="abertura-subtitulo" data-texto="capa.subtitulo"></p>
      </div>
      <div class="abertura-base">
        <button id="btn-comecar" type="button" class="btn-primario btn-grande btn-abertura" data-texto="capa.botao">
          Toque para começar
        </button>
      </div>
    </section>

    <section id="tela-menu" class="tela tela-abertura" aria-labelledby="titulo-menu" hidden>
      <div class="abertura-topo">
        <h1 id="titulo-menu" class="sr-only" data-texto="menu.titulo">Revolta</h1>
        <canvas class="logo-revolta" aria-hidden="true"></canvas>
      </div>
      <div class="abertura-base">
        <nav class="lista-acoes" aria-labelledby="titulo-menu">
          <button type="button" class="btn-primario btn-grande" data-ir-para="jogar" data-texto="menu.jogar">
            Jogar
          </button>
          <button type="button" class="btn-secundario btn-grande" data-ir-para="arquivo" data-texto="menu.arquivo">
            Arquivo da Resistência
          </button>
          <button type="button" class="btn-secundario btn-grande" data-ir-para="sobre" data-texto="menu.sobre">
            Sobre o projeto
          </button>
        </nav>
      </div>
    </section>

    <section id="tela-arquivo" class="tela tela-longa" aria-labelledby="titulo-arquivo" hidden>
      <div class="tela-conteudo tela-conteudo-larga">
        <h1 id="titulo-arquivo" data-texto="arquivo.titulo">Arquivo da Resistência</h1>

        <div class="abas" role="tablist" data-texto-aria="arquivo.abas">
          <button id="aba-provas" type="button" role="tab" class="aba" aria-controls="painel-provas" aria-selected="true" data-texto="arquivo.abaProvas">
            Provas
          </button>
          <button id="aba-povo" type="button" role="tab" class="aba" aria-controls="painel-povo" aria-selected="false" tabindex="-1" data-texto="arquivo.abaPovo">
            Povo
          </button>
        </div>

        <div id="painel-provas" class="painel-arquivo" role="tabpanel" aria-labelledby="aba-provas"></div>
        <div id="painel-povo" class="painel-arquivo" role="tabpanel" aria-labelledby="aba-povo" hidden></div>

        <button type="button" class="btn-secundario" data-ir-para="menu" data-texto="arquivo.voltar">
          Voltar ao menu
        </button>
      </div>
    </section>

    <section id="tela-sobre" class="tela tela-longa" aria-labelledby="titulo-sobre" hidden>
      <div class="tela-conteudo tela-conteudo-larga">
        <h1 id="titulo-sobre" data-texto="sobre.titulo">Sobre o projeto</h1>
        <!-- Preenchido a partir de content/sobre.md -->
        <div id="sobre-conteudo" class="sobre-conteudo"></div>
        <button type="button" class="btn-secundario" data-ir-para="menu" data-texto="sobre.voltar">
          Voltar ao menu
        </button>
      </div>
    </section>

    <section id="tela-intro" class="tela tela-intro" data-texto-aria="intro.regiao" hidden>
      <!-- Quadros e textos vêm de content/intro.json -->
      <div class="intro">
        <div class="intro-topo">
          <p id="intro-progresso" class="texto-suave intro-progresso"></p>
          <button id="btn-intro-pular" type="button" class="btn-secundario" data-texto="intro.pular">
            Pular
          </button>
        </div>
        <figure id="intro-quadro" class="intro-quadro">
          <img id="intro-imagem" src="" alt="" fetchpriority="low" />
          <figcaption id="intro-texto" class="sr-only" aria-live="polite"></figcaption>
        </figure>
        <div id="intro-indicadores" class="intro-indicadores" aria-hidden="true"></div>
        <div class="intro-acoes">
          <button
            id="btn-intro-anterior"
            type="button"
            class="btn-secundario"
            data-texto="intro.anterior"
            disabled
          >
            Anterior
          </button>
          <button id="btn-intro-proximo" type="button" class="btn-primario" data-texto="intro.proximo">
            Próximo
          </button>
        </div>
      </div>
    </section>

    <section id="tela-selecao" class="tela" aria-labelledby="titulo-selecao" hidden>
      <div class="tela-conteudo tela-conteudo-larga">
        <h1 id="titulo-selecao" data-texto="selecao.titulo">Escolha a Fase</h1>
        <ol id="lista-fases" class="lista-fases"></ol>
        <button type="button" class="btn-secundario" data-ir-para="menu" data-texto="selecao.voltar">
          Voltar ao menu
        </button>
      </div>
    </section>

    <section id="tela-fim-prototipo" class="tela" aria-labelledby="titulo-fim-prototipo" hidden>
      <div class="tela-conteudo">
        <h1 id="titulo-fim-prototipo" data-texto="fimPrototipo.titulo">Fim do protótipo</h1>
        <p data-texto="fimPrototipo.texto"></p>
        <button type="button" class="btn-primario" data-ir-para="menu" data-texto="fimPrototipo.botao">
          Voltar ao menu
        </button>
      </div>
    </section>

    <div id="tela-jogo" class="app" hidden>
      <h1 id="hud-nome-fase" class="sr-only" data-texto="hud.titulo">Revolta</h1>

      <main id="palco" class="palco" data-texto-aria="hud.areaJogo">
        <!-- HUD sobre o jogo: Provas (esquerda), Almas (direita), aviso breve de Habitante e pausa. -->
        <div id="hud-jogo" class="hud-jogo">
          <span class="hud-provas" data-texto-title="hud.provasRotulo">
            <svg class="hud-icone" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 1.5h7l3 3v10H3z" />
              <path class="hud-icone-linhas" d="M5 7h6M5 9.5h6M5 12h4" />
            </svg>
            <span id="contador-provas" data-completo="false" aria-live="polite">0/3</span>
          </span>
          <span class="hud-almas" data-texto-title="hud.almasRotulo">
            <svg class="hud-icone" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 1c1.6 3 4 4.6 4 8a4 4 0 0 1-8 0c0-1.6.8-2.6 1.6-3.4C6 7 6.6 7.6 7 8.4 7.4 6 7 3.4 8 1z" />
            </svg>
            <span id="contador-almas" aria-live="polite">0</span>
          </span>
          <span id="status-habitante" class="hud-habitante" role="status" hidden>
            <svg class="icone-habitante" viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="6.5" r="3.5" />
              <path d="M3.5 17.5c.6-3.7 3.2-5.8 6.5-5.8s5.9 2.1 6.5 5.8Z" />
            </svg>
            <span class="hud-habitante-rotulo"></span>
          </span>
          <button
            id="btn-pausa"
            type="button"
            class="hud-pausa"
            aria-haspopup="dialog"
            data-texto-aria="hud.pausa"
            data-texto-title="hud.pausa"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z" /></svg>
          </button>
        </div>
        <div id="mensagem-erro" class="erro" role="alert" hidden>
          <p id="mensagem-erro-texto"></p>
          <button id="btn-erro-voltar" type="button" class="btn-secundario" data-texto="erros.voltar">
            Voltar à seleção de Fases
          </button>
        </div>
      </main>

      <footer class="rodape">
        <p data-texto="hud.rodape"></p>
      </footer>
    </div>

    <div class="regiao-provas" role="region" data-texto-aria="avisoProva.regiao">
      <div id="anuncio-prova" class="sr-only" aria-live="polite"></div>
      <!-- Aviso ao coletar uma Prova: não pausa o jogo; clicar ou tocar abre a história. -->
      <button id="aviso-prova" type="button" class="aviso-prova" popover="manual" aria-haspopup="dialog">
        <span id="aviso-prova-tipo" class="aviso-prova-tipo"></span>
        <strong id="aviso-prova-titulo" class="aviso-prova-titulo"></strong>
        <span id="aviso-prova-resumo" class="aviso-prova-resumo"></span>
        <span class="aviso-prova-dica" data-texto="avisoProva.dica">Toque ou clique para ler</span>
      </button>
    </div>

    <div class="regiao-falas" role="region" data-texto-aria="habitante.regiao">
      <p class="sr-only" data-texto="habitante.anuncios">Anúncios de resgate</p>
      <div id="anuncio-habitante" class="sr-only" aria-live="polite"></div>

      <div id="balao-habitante" class="balao-habitante" popover="manual">
        <img id="balao-retrato" class="balao-retrato" src="" alt="" />
        <div class="balao-corpo">
          <strong id="balao-nome" class="balao-nome"></strong>
          <p id="balao-fala" class="balao-fala"></p>
        </div>
        <button
          id="btn-fechar-balao"
          type="button"
          class="btn-fechar-balao"
          popovertarget="balao-habitante"
          popovertargetaction="hide"
          data-texto-aria="habitante.fechar"
        >
          ×
        </button>
      </div>
    </div>

    <dialog id="modal-pausa" class="modal-pausa" aria-labelledby="titulo-pausa">
      <h2 id="titulo-pausa" data-texto="pausa.titulo">Pausa</h2>
      <form method="dialog" class="acoes-pausa">
        <button value="continuar" class="btn-primario" autofocus data-texto="pausa.continuar">
          Continuar
        </button>
        <button value="totem" class="btn-secundario" data-texto="pausa.totem">
          Voltar ao Totem
        </button>
        <button value="reiniciar" class="btn-secundario" data-texto="pausa.reiniciar">
          Reiniciar Fase
        </button>
        <button value="sair" class="btn-secundario btn-perigo" data-texto="pausa.sair">
          Sair
        </button>
      </form>
    </dialog>

    <dialog id="modal-prova" class="modal-prova" aria-labelledby="prova-titulo">
      <figure class="prova-ilustracao">
        <img id="prova-imagem" src="" alt="" />
      </figure>

      <div class="prova-cabecalho">
        <span id="prova-tipo" class="prova-tipo">O Passado</span>
        <h2 id="prova-titulo">Prova</h2>
      </div>

      <div id="prova-texto" class="prova-texto"></div>

      <form method="dialog" class="acoes-modal acoes-prova">
        <button value="fechar" class="btn-primario btn-continuar" autofocus data-texto="prova.continuar">
          Continuar
        </button>
      </form>
    </dialog>

    <dialog id="modal-conclusao" class="modal-conclusao" aria-labelledby="titulo-conclusao">
      <h2 id="titulo-conclusao">Fase concluída</h2>
      <ul id="resumo-conclusao" class="resumo-conclusao"></ul>
      <form method="dialog" class="acoes-conclusao">
        <button id="btn-proxima" value="proxima" class="btn-primario" autofocus data-texto="fimFase.proxima">
          Próxima
        </button>
        <button value="repetir" class="btn-secundario" data-texto="fimFase.repetir">
          Repetir
        </button>
        <button value="selecao" class="btn-secundario" data-texto="fimFase.selecao">
          Escolher Fase
        </button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
