<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Re(volta) — Fase de Teste</title>
  </head>
  <body>
    <div class="app">
      <header class="hud">
        <div class="hud-titulo">
          <h1>Re(volta)</h1>
          <span
            id="contador-provas"
            class="hud-provas"
            data-completo="false"
            aria-live="polite"
          >
            Provas 0/3
          </span>
          <span id="contador-deslizes" class="hud-meta" aria-live="polite">
            Deslizes: 0
          </span>
          <span id="contador-mortes" class="hud-meta" aria-live="polite">
            Mortes: 0
          </span>
        </div>
        <button
          id="btn-pausa"
          type="button"
          class="btn-secundario"
          aria-haspopup="dialog"
        >
          Pausa
        </button>
      </header>

      <main id="palco" class="palco" aria-label="Área jogável do labirinto">
        <p id="mensagem-erro" class="erro" role="alert" hidden></p>
      </main>

      <footer class="rodape">
        <p>
          Setas ou WASD no PC · Deslize o dedo na tela no celular · Esc/P para pausar · R para
          reiniciar
        </p>
      </footer>
    </div>

    <dialog id="modal-pausa" class="modal-pausa" aria-labelledby="titulo-pausa">
      <h2 id="titulo-pausa">Pausa</h2>
      <form method="dialog" class="acoes-pausa">
        <button value="continuar" class="btn-primario" autofocus>
          Continuar
        </button>
        <button value="totem" class="btn-secundario">
          Voltar ao Totem
        </button>
        <button value="reiniciar" class="btn-secundario">
          Reiniciar Fase
        </button>
        <button value="sair" class="btn-secundario btn-perigo">
          Sair
        </button>
      </form>
    </dialog>

    <dialog id="modal-menu-provisorio" aria-labelledby="titulo-menu-provisorio">
      <h2 id="titulo-menu-provisorio">Re(volta)</h2>
      <p class="texto-suave">
        Você saiu da Fase. O menu principal entra na próxima etapa do protótipo.
      </p>
      <form method="dialog" class="acoes-pausa">
        <button value="jogar" class="btn-primario" autofocus>
          Jogar Fase novamente
        </button>
        <button value="voltar" class="btn-secundario">
          Voltar para onde estava
        </button>
      </form>
    </dialog>

    <dialog id="modal-prova" class="modal-prova" aria-labelledby="prova-titulo">
      <figure class="prova-ilustracao">
        <img id="prova-imagem" src="" alt="" />
      </figure>

      <div class="prova-cabecalho">
        <span id="prova-tipo" class="prova-tipo">O Passado</span>
        <h2 id="prova-titulo">Prova</h2>
      </div>

      <div id="prova-texto" class="prova-texto"></div>

      <form method="dialog" class="acoes-modal acoes-prova">
        <button value="fechar" class="btn-primario btn-continuar" autofocus>
          Continuar
        </button>
      </form>
    </dialog>

    <dialog id="modal-conclusao" aria-labelledby="titulo-conclusao">
      <h2 id="titulo-conclusao">Fase concluída</h2>
      <p id="resumo-conclusao">Você alcançou a Saída.</p>
      <form method="dialog" class="acoes-modal">
        <button value="reiniciar" class="btn-primario" autofocus>
          Jogar novamente
        </button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
